# libva guesses the driver name from the DRM driver, which on this board is
# panthor -- it would look for panthor_drv_video.so and find nothing. Name the
# driver explicitly.
#
# Note: system services do NOT read /usr/lib/environment.d. Anything running as
# a system unit needs its own systemd drop-in as well.
LIBVA_DRIVER_NAME=v4l2_request
