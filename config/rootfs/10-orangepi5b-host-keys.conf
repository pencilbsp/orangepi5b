# Generate missing host keys before sshd validates its configuration.
#
# Noble's openssh-server package starts sshd directly from ssh.service and may
# not ship an enabled sshd-keygen service in this image. Running ssh-keygen -A
# here is idempotent: it creates only absent /etc/ssh/ssh_host_* keys and keeps
# existing per-device keys untouched.
[Service]
# Reset Noble's original ExecStartPre list so key generation happens before
# /usr/sbin/sshd -t. Then restore sshd's original config validation step.
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
